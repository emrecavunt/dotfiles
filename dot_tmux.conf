# ============================================================================
# tmux — Ghostty + agent worktrees
# Prefix: Ctrl-a (Ctrl-a then Ctrl-a sends a literal Ctrl-a)
# ============================================================================

unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Ghostty reports xterm-ghostty. Keep 256colour + truecolour.
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-ghostty:RGB"
set -ag terminal-overrides ",*256col*:RGB"

set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 100000
set -g escape-time 10
set -g focus-events on
set -g aggressive-resize on
set -g set-clipboard on
set -g allow-rename off
setw -g mode-keys vi

# New panes and windows stay in the current worktree.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Option-arrow also works: Ghostty has macos-option-as-alt = true
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind r source-file ~/.tmux.conf \; display-message "tmux reloaded"
bind A new-session -A -s agents

# Catppuccin Mocha, matches Ghostty and Starship
set -g status-position top
set -g status-interval 5
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[fg=#1e1e2e,bg=#89b4fa,bold] #S #[fg=#89b4fa,bg=#1e1e2e] "
set -g status-right "#{?client_prefix,#[fg=#f9e2af]PREFIX ,}#[fg=#cdd6f4]#h #[fg=#585b70]%H:%M"
setw -g window-status-current-format "#[fg=#1e1e2e,bg=#cba6f7,bold] #I:#W "
setw -g window-status-format "#[fg=#6c7086] #I:#W "
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"
set -g message-style "bg=#313244,fg=#cdd6f4"
